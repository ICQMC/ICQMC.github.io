<nav class="navbar">
    <div class="nav-container">
        <a href="{{ '/' | relative_url }}" class="logo">{{ site.data.conference.short_name }}</a>

        <!-- Hamburger menu button for mobile -->
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul class="nav-links" id="navLinks">
            <li><a href="{{ '/' | relative_url }}">Home</a></li>
            <li class="dropdown">
                <a href="#">About</a>
                <ul class="dropdown-menu">
                    <li><a href="{{ '/committees' | relative_url }}#scientific">Scientific Committee</a></li>
                    <li><a href="{{ '/committees' | relative_url }}#organizing">Organizing Committee</a></li>
                </ul>
            </li>
            <li class="dropdown">
                <a href="#">Program</a>
                <ul class="dropdown-menu">
                    <li><a href="{{ '/speakers' | relative_url }}#plenary">Plenary Speakers</a></li>
                    <li><a href="{{ '/speakers' | relative_url }}#invited">Invited Speakers</a></li>
                </ul>
            </li>
            <li><a href="{{ '/registration' | relative_url }}">Registration</a></li>
            <li><a href="{{ '/submission' | relative_url }}">Submission</a></li>
            <li><a href="{{ '/venue' | relative_url }}">Venue</a></li>
            <li class="dropdown">
                <a href="#">History</a>
                <ul class="dropdown-menu">
                    <li><a href="{{ '/icqmc-2025' | relative_url }}">ICQMC 2025</a></li>
                    <li><a href="{{ '/icqmc-2024' | relative_url }}">ICQMC 2024</a></li>
                </ul>
            </li>
        </ul>
    </div>
</nav>

<script>
    // Hamburger menu toggle
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');

    hamburger.addEventListener('click', function () {
        navLinks.classList.toggle('active');
        hamburger.classList.toggle('active');
    });

    // Close menu when clicking outside
    document.addEventListener('click', function (event) {
        const isClickInsideNav = navLinks.contains(event.target) || hamburger.contains(event.target);
        if (!isClickInsideNav && navLinks.classList.contains('active')) {
            navLinks.classList.remove('active');
            hamburger.classList.remove('active');
        }
    });

    // Close menu when clicking a link
    navLinks.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function () {
            if (window.innerWidth <= 768) {
                navLinks.classList.remove('active');
                hamburger.classList.remove('active');
            }
        });
    });
</script>
