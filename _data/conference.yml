# Conference Basic Information
name: "6th ICQMC Annual Meeting"
short_name: "ICQMC 2026"
dates: "May 15-18, 2026"
venue: "Guilin University of Electronic Technology, Guilin, GuangXi, China"
location: "Guilin, GuangXi, China"
email: "icqmc2026@126.com"

# About
about: "The conference will focus on the latest research advances and future trends in quaternion matrix computations and their related applications, and aims to provide a high-level forum for academic exchange and discussion. Topics of interest include, but are not limited to: quaternion matrix computation methods, theoretical analysis of quaternion matrices, large-scale structured matrix problems, color image processing, and applications of quaternions. We also hope to take this opportunity to provide researchers, educators, and practitioners in matrix analysis and related fields with an efficient channel for scholarly exchange, to promote in-depth communication and practical cooperation among peers, to strengthen academic ties, and to foster innovation and the transfer of research outcomes in the relevant disciplines."
